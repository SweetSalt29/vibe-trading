[project]
name = "vibe-trading-ai"
version = "0.1.16"
description = "Natural-language finance research AI agent with backtesting"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    {name = "HKUDS", email = "hkuds@connect.hku.hk"},
]
keywords = ["finance", "trading", "backtesting", "agent", "swarm", "quantitative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "langchain>=1.3.9,<2",
    "langchain-core>=1.0.0,<2",
    "langchain-openai>=1.0.0,<2",
    "langgraph>=1.2.5,<1.3",
    "langgraph-checkpoint>=2.1.0,<5",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "h2>=4.4.1",
    "defusedxml>=0.7.1",
    "oauth-cli-kit>=0.1.3",
    "pandas>=2.0.0,<3.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pypdfium2>=4.0.0",
    "Pillow>=12.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "bottleneck>=1.3.7",
    "duckdb>=1.2.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "yfinance>=0.2.30",
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.18",
    "sse-starlette>=1.6.0",
    # 4.0.0 changed MCPError's constructor (message is now separate) and the
    # session snapshot shape; tests construct it the 2.x way. Cap until the
    # adaptation lands.
    "fastmcp>=2.14.0,<4.0.0",
    "mcp<1.30",
    "ddgs>=6.0.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.7.0",
    "mistune>=3.0.0",
    "nh3>=0.2.18",
    "weasyprint>=60.0",
    # weasyprint needs system pango/cairo libraries pip cannot install; where
    # they are missing the shadow report degraded to HTML-only. reportlab
    # ships binary wheels everywhere and backs the pure-Python PDF fallback
    # (shadow_account/pdf_fallback.py) so the PDF renders on any host.
    "reportlab>=4.0",
    "prompt_toolkit>=3.0.0",
]

[project.urls]
Homepage = "https://vibetrading.wiki/"
Documentation = "https://vibetrading.wiki/docs/"
Repository = "https://github.com/HKUDS/Vibe-Trading"
Issues = "https://github.com/HKUDS/Vibe-Trading/issues"

[project.scripts]
vibe-trading = "cli:main"
vibe-trading-mcp = "mcp_server:main"

[tool.setuptools]
package-dir = {"" = "agent"}
py-modules = ["api_server", "mcp_server"]

[tool.setuptools.packages.find]
where = ["agent"]
include = ["src*", "backtest*", "cli*", "evals*"]

[tool.setuptools.package-data]
"src" = [
    "skills/**/*.md",
    "skills/**/*.yaml",
    "skills/**/*.json",
    "skills/**/*.py",
    "providers/*.json",
    "scheduled_research/playbooks/*.md",
    "swarm/presets/*.yaml",
    "shadow_account/templates/*.j2",
    "shadow_account/templates/*.html",
    "shadow_account/templates/*.css",
    "shadow_account/assets/*.ttf",
    "shadow_account/assets/*.txt",
    "shadow_account/assets/*.md",
]
"evals.harness" = ["README.md", "cases/**/*.json"]
"backtest" = ["*.py"]
"src.factors" = ["zoo/**/*.yaml", "zoo/**/*.md", "zoo/**/NOTICE"]

# India-centric optional extras
[project.optional-dependencies]
zerodha = [
    # Zerodha Kite Connect (India NSE/BSE) broker connector + india_broker
    # loader backend. Lazy-imported with a named error; zerodha_available()
    # stays False (loader falls through to Dhan/Shoonya) until installed.
    "kiteconnect>=4.0.0",
]
deepseek = [
    "langchain-deepseek>=1.0.0,<2",
]
copilot = [
    # Official GitHub Copilot SDK (provider="copilot"). Optional: every import
    # of it in copilot_auth.py is already lazy and raises an actionable install
    # hint when absent, so the base install stays lean.
    "github-copilot-sdk>=1.0.8,<2",
]
anthropic = [
    # Native Anthropic Messages API adapter (provider="anthropic").
    "langchain-anthropic>=1.3.0,<2",
]
openbb = [
    # OpenBB Workspace custom-agent bridge.
    "openbb-ai>=2.0.0,<3",
]
stats = [
    # Econometrics behind src/quantlib/timeseries.
    "statsmodels>=0.14",
    "arch>=6.0",
]
harmonic = [
    "pyharmonics>=1.5.0",
]
smc = [
    # Smart Money Concepts (ICT) signal engine.
    "smartmoneyconcepts>=0.0.27",
]
keyring = [
    # OS credential vault for user-installed local read-only connector plugins.
    "keyring>=25.0.0",
]
discord = [
    "discord.py>=2.4.0",
]
slack = [
    "slack-sdk>=3.33.0",
    "slackify-markdown>=0.2.4,<1",
]
telegram = [
    "python-telegram-bot>=21.0",
]
whatsapp = [
    "neonize>=0.3.18.post0",
]
# 'channels' installs only the India-relevant notification channels
channels = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "discord.py>=2.4.0",
    "mistune>=3.0.0",
    "neonize>=0.3.18.post0",
    "nh3>=0.2.18",
    "python-telegram-bot>=21.0",
    "slack-sdk>=3.33.0",
    "slackify-markdown>=0.2.4,<1",
    "websockets>=12.0",
]
dev = [
    "black>=24.0,<27",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
pythonpath = ["agent"]
markers = [
    "unit: Unit tests (fast, no network)",
    "integration: Integration tests (may need network)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["agent"]

[tool.coverage.run]
source = ["agent"]
omit = [
    "agent/tests/*",
    "agent/tests/**/*",
    "agent/**/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0
exclude_also = [
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Alpha zoo files import the full src.factors.base surface verbatim
# to match research-paper formulas. F401 (unused-import) is noise here;
# F841 (unused-local-variable) stays active to catch real formula bugs.
"agent/src/factors/zoo/**/*.py" = ["F401"]
